name: Deploy

# develop -> ambiente dev | main -> ambiente prod
# Segredos necessários no GitHub (Settings > Secrets): CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Aplicar migrações do D1 (dev)
        run: npx wrangler d1 migrations apply DB --remote --env dev
      - name: Publicar Worker (dev)
        run: npx wrangler deploy --env dev
      # O workflow configurar-datajud só aparece em Actions quando está na main (branch padrão).
      # Por isso o deploy do dev também grava a chave do DataJud, se o GitHub Secret DATAJUD_CHAVE existir.
      - name: Gravar DATAJUD_CHAVE (dev), se existir o GitHub Secret
        env:
          CHAVE_DATAJUD: ${{ secrets.DATAJUD_CHAVE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CHAVE_DATAJUD:-}" ]; then
            echo "Sem GitHub Secret DATAJUD_CHAVE: o DataJud continua desligado no dev."
            exit 0
          fi
          echo "::add-mask::$CHAVE_DATAJUD"
          # A chave vai da variável direto para a entrada padrão do wrangler, sem echo nem argumento.
          printf '%s' "$CHAVE_DATAJUD" | npx wrangler secret put DATAJUD_CHAVE --env dev > /dev/null
          echo "DATAJUD_CHAVE gravada no dev."

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Aplicar migrações do D1 (prod)
        run: npx wrangler d1 migrations apply DB --remote --env prod
      - name: Publicar Worker (prod)
        run: npx wrangler deploy --env prod
      - name: Gravar DATAJUD_CHAVE (prod), se existir o GitHub Secret
        env:
          CHAVE_DATAJUD: ${{ secrets.DATAJUD_CHAVE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CHAVE_DATAJUD:-}" ]; then
            echo "Sem GitHub Secret DATAJUD_CHAVE: o DataJud continua desligado em prod."
            exit 0
          fi
          echo "::add-mask::$CHAVE_DATAJUD"
          printf '%s' "$CHAVE_DATAJUD" | npx wrangler secret put DATAJUD_CHAVE --env prod > /dev/null
          echo "DATAJUD_CHAVE gravada em prod."
