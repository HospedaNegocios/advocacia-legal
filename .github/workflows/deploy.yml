name: Deploy

# develop -> ambiente dev | main -> ambiente prod
# Segredos necessários no GitHub (Settings > Secrets): CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Aplicar migrações do D1 (dev)
        run: npx wrangler d1 migrations apply DB --remote --env dev
      - name: Publicar Worker (dev)
        run: npx wrangler deploy --env dev

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Aplicar migrações do D1 (prod)
        run: npx wrangler d1 migrations apply DB --remote --env prod
      - name: Publicar Worker (prod)
        run: npx wrangler deploy --env prod
